name: colecao
description: "App para acompanhar a coleção de jogos."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Banco local (SQLite) tipado
  drift: ^2.28.0
  drift_flutter: ^0.2.4

  # Estado da interface
  flutter_riverpod: ^3.0.0

  uuid: ^4.5.1
  intl: any # a versão é definida pelo flutter_localizations
  file_picker: ^13.1.0
  http: ^1.6.0
  cached_network_image: ^4.0.4
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.5.0

flutter:
  uses-material-design: true
